<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Mars: editor visual de LaTeX</title>
  <defs>
    <radialGradient id="mars" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#ffb27a"/>
      <stop offset="0.28" stop-color="#ea7a3e"/>
      <stop offset="0.62" stop-color="#c24e22"/>
      <stop offset="1" stop-color="#7a2410"/>
    </radialGradient>
    <radialGradient id="night" cx="30%" cy="26%" r="95%">
      <stop offset="0.5" stop-color="#1a0503" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a0503" stop-opacity="0.72"/>
    </radialGradient>
    <radialGradient id="shine" cx="34%" cy="27%" r="30%">
      <stop offset="0" stop-color="#fff3e2" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff3e2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="128" cy="128" r="90"/></clipPath>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#2a0700" flood-opacity="0.85"/>
    </filter>
  </defs>
  <!-- sin fondo: el planeta solo, agrandado hasta casi el borde (radio 90 x 1,36 = 122) -->
  <g transform="translate(128 128) scale(1.36) translate(-128 -128)">
  <circle cx="128" cy="128" r="90" fill="url(#mars)"/>
  <g clip-path="url(#disc)">
    <!-- llanuras oscuras y el gran cañón, difuminados -->
    <g filter="url(#soft)" fill="#8f2f12" opacity="0.55">
      <path d="M40 120 C70 104 98 112 120 106 C150 98 180 110 216 100 L216 124 C184 132 156 122 128 130 C100 138 70 128 40 140 Z"/>
      <ellipse cx="170" cy="168" rx="30" ry="13" transform="rotate(-18 170 168)"/>
      <ellipse cx="84" cy="178" rx="22" ry="9" transform="rotate(12 84 178)"/>
      <ellipse cx="150" cy="70" rx="20" ry="8" transform="rotate(-8 150 70)"/>
    </g>
    <!-- cráteres -->
    <g fill="none" stroke="#7d2610" stroke-opacity="0.55" stroke-width="2.2">
      <circle cx="96" cy="78" r="7"/><circle cx="182" cy="140" r="5"/><circle cx="118" cy="190" r="6"/><circle cx="62" cy="150" r="4"/>
    </g>
    <g fill="#ffcf9e" fill-opacity="0.25">
      <circle cx="95" cy="77" r="4"/><circle cx="181.5" cy="139.5" r="2.8"/><circle cx="117" cy="189" r="3.4"/>
    </g>
    <!-- casquete polar -->
    <ellipse cx="122" cy="40" rx="34" ry="11" fill="#fff6ec" opacity="0.85" filter="url(#soft)"/>
    <circle cx="128" cy="128" r="90" fill="url(#night)"/>
    <circle cx="128" cy="128" r="90" fill="url(#shine)"/>
  </g>
  <circle cx="128" cy="128" r="90" fill="none" stroke="#ffb07a" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <!-- el logotipo de LaTeX -->
